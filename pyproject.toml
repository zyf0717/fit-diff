[project]
name = "fit-diff"
version = "0.1.0"
description = "Shiny application for comparing fitness device FIT files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "boto3>=1.40.61",
    "botocore>=1.40.61",
    "faicons==0.2.2",
    "fitparse>=1.2.0",
    "garmin-fit-sdk==21.171.0",
    "httpx>=0.28.1",
    "nbformat>=5.10.4",
    "numpy>=2.4.2",
    # CSV timestamp conversion assumes nanosecond datetime storage (pandas 2).
    "pandas>=2.3,<3",
    "plotly==5.24.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "shiny==1.4.0",
    "shinyswatch==0.9.0",
    "shinywidgets==0.6.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
package = false
